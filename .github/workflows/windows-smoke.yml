name: Windows smoke

# A fresh checkout on Windows must start the studio and render a film. Unit tests alone do not prove Chrome, ffmpeg,
# junctions, cmd.exe and the render pipeline work together on a Windows machine.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Start and render on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/windows-smoke.mjs
